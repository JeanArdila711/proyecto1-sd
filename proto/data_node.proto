syntax = "proto3";

package dfsha.data_node;

service DataNodeService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc WriteBlock(stream WriteBlockChunk) returns (WriteBlockResponse);
  rpc ReadBlock(ReadBlockRequest) returns (stream ReadBlockChunk);
  rpc DeleteBlock(DeleteBlockRequest) returns (DeleteBlockResponse);
  rpc ReplicateBlock(ReplicateBlockRequest) returns (ReplicateBlockResponse);
  rpc ListStoredBlocks(ListStoredBlocksRequest) returns (stream StoredBlock);
}

message WriteBlockHeader {
  string block_id = 1;
  // DataNodes que siguen en el pipeline; vacío = este es el último eslabón
  repeated string downstream = 2;
}

message WriteBlockChunk {
  oneof payload {
    WriteBlockHeader header = 1;
    bytes data = 2;
  }
}

message WriteBlockResponse {
  string checksum = 1;
  int64 bytes_written = 2;
}

message PingRequest {}
message PingResponse {}

// offset y length recortan la lectura dentro del bloque (RF3 `read`). length 0 = hasta
// el final del bloque, así un cliente que no manda los campos sigue leyendo el bloque
// completo.
message ReadBlockRequest {
  string block_id = 1;
  int64 offset = 2;
  int64 length = 3;
}
message ReadBlockChunk { bytes data = 1; }

message DeleteBlockRequest { string block_id = 1; }
message DeleteBlockResponse {}

message ReplicateBlockRequest {
  string block_id = 1;
  string target = 2;
}

message ReplicateBlockResponse {
  string checksum = 1;
  int64 bytes_written = 2;
}

// Inventario del DataNode para el recolector de huérfanos (A3). Stream: puede haber
// muchos bloques. age_s la calcula el DataNode con su reloj, así quien decide borrar
// no compara relojes de máquinas distintas.
message ListStoredBlocksRequest {}
message StoredBlock {
  string block_id = 1;
  int64 size_bytes = 2;
  double age_s = 3;
}
