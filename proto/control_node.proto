syntax = "proto3";

package dfsha.control_node;

service ControlNodeService {
  rpc ListDir(ListDirRequest) returns (ListDirResponse);
  rpc MakeDir(MakeDirRequest) returns (MakeDirResponse);
  rpc RemoveDir(RemoveDirRequest) returns (RemoveDirResponse);
  rpc Remove(RemoveRequest) returns (RemoveResponse);
  rpc BeginUpload(BeginUploadRequest) returns (BeginUploadResponse);
  rpc ConfirmBlock(ConfirmBlockRequest) returns (ConfirmBlockResponse);
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  rpc AbortUpload(AbortUploadRequest) returns (AbortUploadResponse);
  rpc ListBlocks(ListBlocksRequest) returns (ListBlocksResponse);
  rpc Lock(LockRequest) returns (LockResponse);
  rpc RenewLock(RenewLockRequest) returns (RenewLockResponse);
  rpc Unlock(UnlockRequest) returns (UnlockResponse);
  // RF3 write (B3): escritura copy-on-write en tres pasos. BeginWrite reserva bloques
  // nuevos, el cliente los escribe por el pipeline normal y CommitWrite los publica.
  rpc BeginWrite(BeginWriteRequest) returns (BeginWriteResponse);
  rpc CommitWrite(CommitWriteRequest) returns (CommitWriteResponse);
  rpc AbortWrite(AbortWriteRequest) returns (AbortWriteResponse);
  // C2. Con la autenticación activa, todos los RPC exigen `authorization: Bearer <jwt>`
  // en la metadata de la llamada. Login es el único que no: es el que entrega el token.
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // C3. Permisos por archivo.
  rpc Chmod(ChmodRequest) returns (ChmodResponse);
  rpc Chown(ChownRequest) returns (ChownResponse);
  // C3. Inventario de un DataNode, solo para admin. El ControlNode hace de proxy con su
  // capability interna, que nunca sale de los nodos. Lo usa `inspect huerfanos`.
  rpc DataNodeInventory(DataNodeInventoryRequest) returns (DataNodeInventoryResponse);
}

message ListDirRequest { string path = 1; }

message DirEntry {
  string name = 1;
  bool is_dir = 2;
  int64 size_bytes = 3;
  // C3. Dueño, grupo y modo rwx (0 a 0o777) de la entrada.
  string owner = 4;
  string group = 5;
  uint32 mode = 6;
}

message ListDirResponse { repeated DirEntry entries = 1; }

// op_id: identificador de la operación lógica, generado UNA vez por el cliente y
// reutilizado sin cambios en cada reintento. El ControlNode deduplica por op_id,
// así un reintento tras un failover de líder no aplica la operación dos veces.
// Obligatorio en todas las requests que mutan; vacío => INVALID_ARGUMENT.

message MakeDirRequest  { string path = 1; string op_id = 2; }
message MakeDirResponse {}

message RemoveDirRequest  { string path = 1; string op_id = 2; }
message RemoveDirResponse {}

message RemoveRequest  { string path = 1; string op_id = 2; }
message RemoveResponse {}

message BeginUploadRequest {
  string path = 1;
  int64 size_bytes = 2;
  string op_id = 3;
}

message BlockLocation {
  string block_id = 1;
  repeated string datanode_addresses = 2;
  int64 size_bytes = 3;
  // C3. Capability de escritura de este bloque; se manda en la metadata
  // `dfsha-capability` del WriteBlock. Vacía si el ControlNode no tiene clave.
  string capability = 4;
}

message BeginUploadResponse { repeated BlockLocation blocks = 1; }

message ConfirmBlockRequest {
  string path = 1;
  string block_id = 2;
  string checksum = 3;
  int64 size_bytes = 4;
  string op_id = 5;
}
message ConfirmBlockResponse {}

message CompleteUploadRequest { string path = 1; string op_id = 2; }
message CompleteUploadResponse {}

message AbortUploadRequest { string path = 1; string op_id = 2; }
message AbortUploadResponse {}

message ListBlocksRequest { string path = 1; }

message BlockInfo {
  string block_id = 1;
  repeated string datanode_addresses = 2;
  string checksum = 3;
  int64 size_bytes = 4;
  // C3. Capability de lectura de este bloque, válida en cualquiera de sus réplicas.
  string capability = 5;
}

message ListBlocksResponse { repeated BlockInfo blocks = 1; }

message LockRequest {
  string path = 1;
  string mode = 2; // "r" (compartido) o "w" (exclusivo)
  string op_id = 3;
}
message LockResponse { string lock_id = 1; double lease_s = 2; }

message RenewLockRequest { string path = 1; string lock_id = 2; string op_id = 3; }
message RenewLockResponse {}

message UnlockRequest { string path = 1; string lock_id = 2; string op_id = 3; }
message UnlockResponse {}

// Un bloque que toca la escritura. old_block_id vacío = el slot extiende el archivo.
message WriteSlot {
  int64 index = 1;
  string old_block_id = 2;
  int64 old_size = 3;
  repeated string old_addresses = 4;
  string new_block_id = 5;
  repeated string new_addresses = 6;
  int64 new_size = 7;
  // C3. Lectura del bloque viejo (vacía si el slot extiende el archivo) y escritura del nuevo.
  string old_capability = 8;
  string new_capability = 9;
}

message BeginWriteRequest {
  string path = 1;
  int64 offset = 2;
  int64 length = 3;
  string lock_id = 4; // lock exclusivo vigente del que escribe
  string op_id = 5;
}
message BeginWriteResponse {
  string write_id = 1;
  int64 base_version = 2;
  int64 block_size = 3;
  double lease_s = 4; // vida de la reserva: sin commit en ese tiempo, se descarta
  repeated WriteSlot slots = 5;
}

message ConfirmedSlot {
  int64 index = 1;
  string block_id = 2;
  string checksum = 3;
  int64 size_bytes = 4;
}
message CommitWriteRequest {
  string path = 1;
  string write_id = 2;
  int64 base_version = 3;
  string lock_id = 4;
  repeated ConfirmedSlot slots = 5;
  string op_id = 6;
}
message CommitWriteResponse { int64 version = 1; }

message AbortWriteRequest { string path = 1; string write_id = 2; string lock_id = 3; string op_id = 4; }
message AbortWriteResponse {}

// Login no lleva op_id: no cambia el estado.
message LoginRequest { string username = 1; string password = 2; }
message LoginResponse {
  string token = 1;
  double expires_in_s = 2;
  // Lo mismo que afirma el token, para que el cliente no tenga que decodificarlo.
  string username = 3;
  repeated string groups = 4;
  bool is_admin = 5;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  repeated string groups = 3; // vacío => un grupo con el nombre del usuario
  bool is_admin = 4;
  string op_id = 5;
}
message CreateUserResponse {}

message ChangePasswordRequest {
  string username = 1;         // vacío => quien llama
  string current_password = 2; // obligatoria al cambiar la propia
  string new_password = 3;
  string op_id = 4;
}
message ChangePasswordResponse {}

// C3. chmod: solo el dueño o un admin. chown: el dueño lo cambia solo un admin; el grupo,
// el dueño si pertenece al grupo nuevo, o un admin.
message ChmodRequest { string path = 1; uint32 mode = 2; string op_id = 3; }
message ChmodResponse {}

message ChownRequest {
  string path = 1;
  string owner = 2; // vacío => no cambia
  string group = 3; // vacío => no cambia
  string op_id = 4;
}
message ChownResponse {}

// C3. address tiene que ser una de las --datanode-addresses del ControlNode.
message DataNodeInventoryRequest { string address = 1; }
message StoredBlockInfo { string block_id = 1; int64 size_bytes = 2; double age_s = 3; }
message DataNodeInventoryResponse { repeated StoredBlockInfo blocks = 1; }
