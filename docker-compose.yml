# DFSha — clúster completo en contenedores. Guía de uso: docs/GUIA.md
# Parámetros (tamaño de bloque, factor de replicación, lease): archivo .env
# Secretos (llaves, password de Raft, certificados TLS, secreto de los tokens, clave de las
# capabilities): ./secrets,
# los crea el servicio init la primera vez. Nunca van al repo. Cada contenedor monta solo
# su vista (./secrets/mounts/<rol>), con los archivos que usa; la carpeta entera, donde
# está la llave de la CA, solo la ve init.
#
# La shell y el inspector de este archivo corren dentro de la red del clúster y usan las
# direcciones internas de los DataNodes (dn1:50061), que solo resuelven ahí. Para entrar
# desde otra máquina: docker-compose.publico.yml en el clúster y el servicio `cliente` en
# la máquina de quien se conecta (docs/GUIA.md, "Entrar desde otra máquina").

# Una sola imagen para todo. La construye solo init: si cada servicio tuviera `build`,
# Compose construiría la misma imagen 8 veces en paralelo y chocarían entre sí.
x-dfsha: &dfsha
  image: dfsha:local
  pull_policy: never    # es local: nunca buscarla en Docker Hub
  networks: [dfsha]
  init: true            # PID 1 que reenvía señales: el nodo se apaga limpio con docker compose stop

x-datanode: &datanode
  <<: *dfsha
  depends_on:
    init: { condition: service_completed_successfully }
  healthcheck:
    test: ["CMD", "python", "scripts/healthcheck.py", "localhost:50061", "--tls-ca-file", "/secrets/ca.crt"]
    interval: 3s
    timeout: 5s
    retries: 20

x-controlnode: &controlnode
  <<: *dfsha
  depends_on:
    dn1: { condition: service_healthy }
    dn2: { condition: service_healthy }
    dn3: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "python", "scripts/healthcheck.py", "localhost:50051", "--tls-ca-file", "/secrets/ca.crt"]
    interval: 3s
    timeout: 5s
    retries: 20

# Mismos puertos internos en todos los nodos: cada contenedor tiene su propia IP.
# --raft-cluster usa nombres de servicio, nunca localhost: pysyncobj escucha en la
# misma dirección que anuncia a los demás nodos. La lista es idéntica en los 3.
# TLS: todos los nodos presentan secrets/node.crt; clientes y nodos lo verifican con
# secrets/ca.crt.
# Autenticación: los ControlNodes firman los tokens de sesión con secrets/jwt.secret y
# crean al usuario admin con secrets/admin.password la primera vez. En la shell:
#   dfsha:/$ login admin
# Capabilities (C3): los ControlNodes firman con secrets/capability.key un permiso por bloque
# y por operación, y los DataNodes lo exigen en cada RPC salvo Ping. La shell y el
# inspector no ven esa clave: reciben las capabilities del ControlNode.

services:
  # Crea los secretos que falten y termina. Corre como root para dejar los archivos con
  # el dueño del usuario de la imagen (uid 1000): en Linux, si no, los nodos no podrían
  # leerlos. Prepara también ./intercambio para que la shell pueda escribir ahí.
  init:
    <<: *dfsha
    build: .
    pull_policy: build
    user: "0:0"
    command: [python, scripts/generate_secrets.py, --dir, /secrets, --owner, "1000:1000", --writable-dir, /intercambio,
              --datanodes, "${DFSHA_DATANODE_COUNT:-3}"]
    volumes: [./secrets:/secrets, ./intercambio:/intercambio]

  dn1:
    <<: *datanode
    hostname: dn1
    command: [python, -m, dfsha.data_node.main, --root, /data, --port, "50061", --encryption-key-file, /secrets/dn1.key,
              --capability-key-file, /secrets/capability.key,
              --tls-ca-file, /secrets/ca.crt, --tls-cert-file, /secrets/node.crt, --tls-key-file, /secrets/node.key]
    volumes: [dn1-data:/data, ./secrets/mounts/dn1:/secrets:ro]
  dn2:
    <<: *datanode
    hostname: dn2
    command: [python, -m, dfsha.data_node.main, --root, /data, --port, "50061", --encryption-key-file, /secrets/dn2.key,
              --capability-key-file, /secrets/capability.key,
              --tls-ca-file, /secrets/ca.crt, --tls-cert-file, /secrets/node.crt, --tls-key-file, /secrets/node.key]
    volumes: [dn2-data:/data, ./secrets/mounts/dn2:/secrets:ro]
  dn3:
    <<: *datanode
    hostname: dn3
    command: [python, -m, dfsha.data_node.main, --root, /data, --port, "50061", --encryption-key-file, /secrets/dn3.key,
              --capability-key-file, /secrets/capability.key,
              --tls-ca-file, /secrets/ca.crt, --tls-cert-file, /secrets/node.crt, --tls-key-file, /secrets/node.key]
    volumes: [dn3-data:/data, ./secrets/mounts/dn3:/secrets:ro]

  # Dos DataNodes más, solo con el perfil `escala` (evidencia de escalabilidad, docs/escalabilidad.md).
  # La lista de DataNodes es estática: para que los ControlNodes los usen hay que pasarles
  # la lista nueva (DFSHA_DATANODES) y reiniciarlos. Todo eso lo trae .env.escala:
  #   docker compose --env-file .env --env-file .env.escala up -d
  dn4:
    <<: *datanode
    profiles: [escala]
    hostname: dn4
    command: [python, -m, dfsha.data_node.main, --root, /data, --port, "50061", --encryption-key-file, /secrets/dn4.key,
              --capability-key-file, /secrets/capability.key,
              --tls-ca-file, /secrets/ca.crt, --tls-cert-file, /secrets/node.crt, --tls-key-file, /secrets/node.key]
    volumes: [dn4-data:/data, ./secrets/mounts/dn4:/secrets:ro]
  dn5:
    <<: *datanode
    profiles: [escala]
    hostname: dn5
    command: [python, -m, dfsha.data_node.main, --root, /data, --port, "50061", --encryption-key-file, /secrets/dn5.key,
              --capability-key-file, /secrets/capability.key,
              --tls-ca-file, /secrets/ca.crt, --tls-cert-file, /secrets/node.crt, --tls-key-file, /secrets/node.key]
    volumes: [dn5-data:/data, ./secrets/mounts/dn5:/secrets:ro]

  cn0:
    <<: *controlnode
    hostname: cn0
    command:
      - python
      - -m
      - dfsha.control_node.main
      - --node-id=0
      - --port=50051
      - --raft-cluster=cn0:6000,cn1:6000,cn2:6000
      - --data-dir=/raft
      - --datanode-addresses=${DFSHA_DATANODES:-dn1:50061,dn2:50061,dn3:50061}
      - --block-size-mb=${DFSHA_BLOCK_MB:-128}
      - --replication-factor=${DFSHA_REPLICATION:-3}
      - --min-write-replicas=${DFSHA_MIN_WRITE_REPLICAS:-2}
      - --heartbeat-interval-s=${DFSHA_HEARTBEAT_INTERVAL_S:-2}
      - --datanode-dead-after-s=${DFSHA_DATANODE_DEAD_AFTER_S:-6}
      - --rereplication-interval-s=${DFSHA_REREPLICATION_INTERVAL_S:-10}
      - --rereplication-delay-s=${DFSHA_REREPLICATION_DELAY_S:-30}
      - --rereplication-max-per-cycle=${DFSHA_REREPLICATION_MAX_PER_CYCLE:-4}
      - --gc-interval-s=${DFSHA_GC_INTERVAL_S:-60}
      - --gc-grace-s=${DFSHA_GC_GRACE_S:-1200}
      - --upload-lease-s=${DFSHA_UPLOAD_LEASE_S:-600}
      - --raft-password-file=/secrets/raft.password
      - --jwt-secret-file=/secrets/jwt.secret
      - --admin-password-file=/secrets/admin.password
      - --token-ttl-s=${DFSHA_TOKEN_TTL_S:-1800}
      - --capability-key-file=/secrets/capability.key
      - --capability-ttl-s=${DFSHA_CAPABILITY_TTL_S:-3600}
      - --tls-ca-file=/secrets/ca.crt
      - --tls-cert-file=/secrets/node.crt
      - --tls-key-file=/secrets/node.key
    volumes: [cn0-raft:/raft, ./secrets/mounts/control:/secrets:ro]
  cn1:
    <<: *controlnode
    hostname: cn1
    command:
      - python
      - -m
      - dfsha.control_node.main
      - --node-id=1
      - --port=50051
      - --raft-cluster=cn0:6000,cn1:6000,cn2:6000
      - --data-dir=/raft
      - --datanode-addresses=${DFSHA_DATANODES:-dn1:50061,dn2:50061,dn3:50061}
      - --block-size-mb=${DFSHA_BLOCK_MB:-128}
      - --replication-factor=${DFSHA_REPLICATION:-3}
      - --min-write-replicas=${DFSHA_MIN_WRITE_REPLICAS:-2}
      - --heartbeat-interval-s=${DFSHA_HEARTBEAT_INTERVAL_S:-2}
      - --datanode-dead-after-s=${DFSHA_DATANODE_DEAD_AFTER_S:-6}
      - --rereplication-interval-s=${DFSHA_REREPLICATION_INTERVAL_S:-10}
      - --rereplication-delay-s=${DFSHA_REREPLICATION_DELAY_S:-30}
      - --rereplication-max-per-cycle=${DFSHA_REREPLICATION_MAX_PER_CYCLE:-4}
      - --gc-interval-s=${DFSHA_GC_INTERVAL_S:-60}
      - --gc-grace-s=${DFSHA_GC_GRACE_S:-1200}
      - --upload-lease-s=${DFSHA_UPLOAD_LEASE_S:-600}
      - --raft-password-file=/secrets/raft.password
      - --jwt-secret-file=/secrets/jwt.secret
      - --admin-password-file=/secrets/admin.password
      - --token-ttl-s=${DFSHA_TOKEN_TTL_S:-1800}
      - --capability-key-file=/secrets/capability.key
      - --capability-ttl-s=${DFSHA_CAPABILITY_TTL_S:-3600}
      - --tls-ca-file=/secrets/ca.crt
      - --tls-cert-file=/secrets/node.crt
      - --tls-key-file=/secrets/node.key
    volumes: [cn1-raft:/raft, ./secrets/mounts/control:/secrets:ro]
  cn2:
    <<: *controlnode
    hostname: cn2
    command:
      - python
      - -m
      - dfsha.control_node.main
      - --node-id=2
      - --port=50051
      - --raft-cluster=cn0:6000,cn1:6000,cn2:6000
      - --data-dir=/raft
      - --datanode-addresses=${DFSHA_DATANODES:-dn1:50061,dn2:50061,dn3:50061}
      - --block-size-mb=${DFSHA_BLOCK_MB:-128}
      - --replication-factor=${DFSHA_REPLICATION:-3}
      - --min-write-replicas=${DFSHA_MIN_WRITE_REPLICAS:-2}
      - --heartbeat-interval-s=${DFSHA_HEARTBEAT_INTERVAL_S:-2}
      - --datanode-dead-after-s=${DFSHA_DATANODE_DEAD_AFTER_S:-6}
      - --rereplication-interval-s=${DFSHA_REREPLICATION_INTERVAL_S:-10}
      - --rereplication-delay-s=${DFSHA_REREPLICATION_DELAY_S:-30}
      - --rereplication-max-per-cycle=${DFSHA_REREPLICATION_MAX_PER_CYCLE:-4}
      - --gc-interval-s=${DFSHA_GC_INTERVAL_S:-60}
      - --gc-grace-s=${DFSHA_GC_GRACE_S:-1200}
      - --upload-lease-s=${DFSHA_UPLOAD_LEASE_S:-600}
      - --raft-password-file=/secrets/raft.password
      - --jwt-secret-file=/secrets/jwt.secret
      - --admin-password-file=/secrets/admin.password
      - --token-ttl-s=${DFSHA_TOKEN_TTL_S:-1800}
      - --capability-key-file=/secrets/capability.key
      - --capability-ttl-s=${DFSHA_CAPABILITY_TTL_S:-3600}
      - --tls-ca-file=/secrets/ca.crt
      - --tls-cert-file=/secrets/node.crt
      - --tls-key-file=/secrets/node.key
    volumes: [cn2-raft:/raft, ./secrets/mounts/control:/secrets:ro]

  # Shell interactiva. ./intercambio del host aparece como /intercambio dentro:
  #   dfsha:/$ send /intercambio/tesis.pdf /docs/tesis.pdf
  shell:
    <<: *dfsha
    profiles: [cliente]
    stdin_open: true
    tty: true
    working_dir: /intercambio
    # --internal-addresses: esta shell está dentro de la red, marca a los DataNodes por su
    # nombre interno aunque el clúster también se anuncie hacia afuera.
    command: [python, -m, dfsha.client.distributed_shell_main, --control-nodes, "cn0:50051,cn1:50051,cn2:50051",
              --tls-ca-file, /secrets/ca.crt, --parallel-transfers, "${DFSHA_PARALLEL_TRANSFERS:-4}",
              --internal-addresses]
    volumes: [./intercambio:/intercambio, ./secrets/mounts/client:/secrets:ro]

  # Shell desde OTRA máquina, contra un clúster levantado con docker-compose.publico.yml.
  # No arranca ni necesita un clúster local, y no entra a la red interna:
  #   DFSHA_CONTROL_NODES=<host>:50051,<host>:50052,<host>:50053 docker compose run --rm cliente
  # Necesita el ca.crt de ese clúster en la carpeta DFSHA_CLIENT_SECRETS (por defecto, la
  # del clúster local). Con otro clúster local en la misma máquina, usa una carpeta aparte.
  cliente:
    image: dfsha:local
    build: .
    profiles: [externo]
    init: true
    stdin_open: true
    tty: true
    working_dir: /intercambio
    command: [python, -m, dfsha.client.distributed_shell_main, --control-nodes, "${DFSHA_CONTROL_NODES:-}",
              --tls-ca-file, /secrets/ca.crt, --parallel-transfers, "${DFSHA_PARALLEL_TRANSFERS:-4}"]
    volumes: [./intercambio:/intercambio, "${DFSHA_CLIENT_SECRETS:-./secrets/mounts/client}:/secrets:ro"]
    # Para probar en la misma máquina del clúster: host.docker.internal es el host.
    extra_hosts: ["host.docker.internal:host-gateway"]

  # docker compose run --rm inspect estado|lider|arbol|mapa|huerfanos|bloques <ruta>
  inspect:
    <<: *dfsha
    profiles: [herramientas]
    # Entra como admin con la contraseña inicial; si ya la cambiaste, la pide por teclado.
    entrypoint: [python, scripts/inspect_cluster.py, --tls-ca-file, /secrets/ca.crt,
                 --password-file, /secrets/admin.password]
    command: [estado]
    volumes: [./secrets/mounts/inspect:/secrets:ro]
    environment:
      DFSHA_GC_GRACE_S: ${DFSHA_GC_GRACE_S:-1200}   # para que `huerfanos` use la misma gracia que el recolector
      DFSHA_DATANODES: ${DFSHA_DATANODES:-}         # la misma lista de DataNodes que los ControlNodes

  tests:
    <<: *dfsha
    profiles: [tests]
    command: [python, -m, pytest, tests/, -q, -p, no:cacheprovider]

networks:
  dfsha:

volumes:
  dn1-data:
  dn2-data:
  dn3-data:
  dn4-data:
  dn5-data:
  cn0-raft:
  cn1-raft:
  cn2-raft:
